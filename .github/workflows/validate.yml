name: Validate Skill
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate manifest and run tests
        run: python scripts/validate_skill.py

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse to move existing version tags
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json; print(json.load(open("MANIFEST.json", encoding="utf-8"))["version"])')
          TAG="v$VERSION"
          git fetch --tags --quiet
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            EXISTING=$(git rev-list -n 1 "$TAG")
            if [ "$EXISTING" != "$GITHUB_SHA" ]; then
              echo "Release tag $TAG already points to $EXISTING, refusing to move it" >&2
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create source ZIP and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_skill.py
          mkdir -p dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import json
          root = Path.cwd()
          version = json.loads((root / "MANIFEST.json").read_text(encoding="utf-8"))["version"]
          name = f"m1racle-intaglio-director-v{version}.zip"
          with ZipFile(root / "dist" / name, "w", compression=ZIP_DEFLATED) as z:
              for path in sorted(root.rglob("*")):
                  if path.is_file() and not set(path.relative_to(root).parts) & {".git", "dist", "__pycache__"} and path.suffix != ".pyc":
                      z.write(path, arcname=str(Path("m1racle-intaglio-director") / path.relative_to(root)))
          print(name)
          PY
          (
            cd dist
            for archive in *.zip; do
              sha256sum "$archive" > "$archive.sha256"
            done
          )
      - name: Publish immutable release or complete an existing tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already published: $TAG"
            exit 0
          fi
          gh release create "$TAG" dist/*.zip dist/*.sha256 \
            --verify-tag \
            --title "M1racle Intaglio Director $TAG" \
            --notes-file docs/field-test-20261109.md
