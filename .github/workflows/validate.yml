name: Skill validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate root skill
        run: python scripts/validate_skill.py
      - name: Verify offline gallery and reference manifest
        run: python scripts/verify_gallery.py
      - name: Test evaluation contract (synthetic assertions only)
        run: python scripts/test_eval_contract.py
      - name: Test cross-agent installation
        run: python scripts/test_install.py
      - name: Test bounded ZIP installer (offline)
        run: python scripts/test_quick_install.py
      - name: Prevent slow installer regressions
        run: python scripts/test_install_docs.py
      - name: Validate simulated GitHub ZIP folder
        shell: python
        run: |
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile
          with tempfile.TemporaryDirectory() as tmp:
              source = Path.cwd()
              target = Path(tmp) / "m1racle-visual-director-main"
              shutil.copytree(source, target, ignore=shutil.ignore_patterns(".git"))
              for script in ("validate_skill.py", "verify_gallery.py"):
                  subprocess.run([sys.executable, str(target / "scripts" / script)], check=True)

      - name: Regression tests for gallery validator
        run: python scripts/test_gallery.py

  deploy-pages:
    # Pages has to be enabled once under Settings > Pages (source: GitHub Actions).
    # Until then, do not turn an otherwise green main-branch CI run red.
    if: github.ref == 'refs/heads/main' && github.event.repository.has_pages == true
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
