name: Validate Skill
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate manifest and run tests
        run: python scripts/validate_skill.py

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse to move existing version tags
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json; print(json.load(open("MANIFEST.json", encoding="utf-8"))["version"])')
          TAG="v$VERSION"
          git fetch --tags --quiet
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            EXISTING=$(git rev-list -n 1 "$TAG")
            if [ "$EXISTING" != "$GITHUB_SHA" ]; then
              echo "Release tag $TAG already points to $EXISTING, refusing to move it" >&2
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          NOTES="docs/releases/$TAG.md"
          if [ ! -s "$NOTES" ]; then
            echo "Release notes missing: $NOTES" >&2
            exit 1
          fi
      - name: Build deterministic ZIP and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_skill.py
          python scripts/build_release.py
          (
            cd dist
            for digest in *.zip.sha256; do
              sha256sum -c "$digest"
            done
          )
      - name: Publish and verify immutable release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="m1racle-intaglio-director-v$VERSION.zip"
          LOCAL_ZIP="dist/$ZIP"
          LOCAL_SUM="dist/$ZIP.sha256"
          NOTES="docs/releases/$TAG.md"
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$LOCAL_ZIP" "$LOCAL_SUM" \\
              --verify-tag \\
              --title "M1racle Intaglio Director $TAG" \\
              --notes-file "$NOTES"
          fi
          export EXPECTED_ZIP_DIGEST="sha256:$(cut -d ' ' -f 1 "$LOCAL_SUM")"
          export EXPECTED_SUM_DIGEST="sha256:$(sha256sum "$LOCAL_SUM" | cut -d ' ' -f 1)"
          export RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          python - <<'PY'
          import json, os, sys
          release = json.loads(os.environ["RELEASE_JSON"])
          version = os.environ["VERSION"]
          archive = f"m1racle-intaglio-director-v{version}.zip"
          assets = {asset["name"]: asset for asset in release.get("assets", [])}
          expected = {
              archive: os.environ["EXPECTED_ZIP_DIGEST"],
              archive + ".sha256": os.environ["EXPECTED_SUM_DIGEST"],
          }
          for name, digest in expected.items():
              asset = assets.get(name)
              if not asset or asset.get("state") != "uploaded" or asset.get("digest") != digest:
                  raise SystemExit(f"Release asset verification failed for {name}: {asset}")
          print("PASS: release ZIP and SHA-256 attachment digests match local build")
          PY
