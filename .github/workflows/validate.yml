name: Skill validation
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate root skill
        run: python scripts/validate_skill.py
      - name: Verify offline gallery and reference manifest
        run: python scripts/verify_gallery.py
      - name: Test cross-agent installation
        run: python scripts/test_install.py
      - name: Validate simulated GitHub ZIP folder
        shell: python
        run: |
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile
          with tempfile.TemporaryDirectory() as tmp:
              source = Path.cwd()
              target = Path(tmp) / "m1racle-visual-director-main"
              shutil.copytree(source, target, ignore=shutil.ignore_patterns(".git"))
              for script in ("validate_skill.py", "verify_gallery.py"):
                  subprocess.run([sys.executable, str(target / "scripts" / script)], check=True)

  package-workbuddy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and validate WorkBuddy import ZIP
        run: python scripts/package_workbuddy.py
      - name: Upload WorkBuddy skill package
        uses: actions/upload-artifact@v4
        with:
          name: m1racle-visual-director-workbuddy-v1.3.1
          path: dist/m1racle-visual-director-workbuddy-v1.3.1.zip
          if-no-files-found: error
